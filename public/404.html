<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redireciona de volta para a raiz da aplicação preservando o caminho
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?' +
        (l.pathname.slice(repoPath.length).replace(/^[\\/]+/, '') ? 'p=' + encodeURIComponent(l.pathname.slice(repoPath.length).replace(/^[\\/]+/, '')) + '&' : '') +
        l.search.slice(1) +
        l.hash
      );
    </script>
  </head>
  <body style="background:#1e1e1e;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Carregando...</p>
  </body>
</html>
