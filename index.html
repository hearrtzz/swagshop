<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWAGSHOP</title>
    <meta name="description" content="Editor profissional de imagens e estúdio de canvas no estilo macOS escuro com redimensionamento de prancheta, efeitos fotográficos e menu de exportação estilo Photoshop." />
    <meta property="og:title" content="SWAGSHOP" />
    <meta property="og:description" content="Editor profissional de imagens e estúdio de canvas no estilo macOS escuro com redimensionamento de prancheta, efeitos fotográficos e menu de exportação estilo Photoshop." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#1e1e1e] text-[#e0e0e0] select-none antialiased overflow-hidden font-sans">
    <div id="root"></div>

    <!-- SVG filter definition for 2D line boil if cartoon mode is rendered -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <filter id="cartoon-boil" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="noise" />
          <feDisplacementMap id="boil-disp" in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
